<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12172a; }
  #game { position: fixed; inset: 0; margin: auto; display: block; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Clockwork Kitchen: pick ingredients, cook them, build dishes on the plate and serve before the shift timer runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
